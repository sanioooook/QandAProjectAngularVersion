server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Text assets compress ~4x; it matters most on slow mobile connections.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Docker's DNS. With the upstream in a variable nginx re-resolves "api", so recreating the API
    # container (new IP) does not leave the proxy pointing at the old address with 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    # The API is served from the same origin, so the auth cookie stays first-party (SameSite=Lax).
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular's build output is content-hashed (main-5J4I3NW7.js, chunk-....js): it never changes.
    # (add_header in a location replaces the server-level ones, hence the repetition.)
    location ~* "-[A-Za-z0-9_]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff;
    }

    # A missing file is a 404, not the app: /favicon.ico must not get index.html.
    location ~* "\.(ico|png|jpe?g|webp|svg|js|css|map|json|txt)$" {
        try_files $uri =404;
        add_header X-Content-Type-Options nosniff;
    }

    # SPA: every other path is a client-side route.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        add_header Referrer-Policy strict-origin-when-cross-origin;
    }
}
